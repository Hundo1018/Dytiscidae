[workspace]
name = "dytiscidae-mojo"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# `max` is required, not just `mojo-compiler`: the `layout` package that
# provides TileTensor ships with MAX, and without it every GPU source fails
# with "unable to locate module 'layout'".
mojo-compiler = ">=1.0.0b"
max = "*"
python = "3.12.*"
numpy = "*"

[tasks]
# Always go through pixi.  Invoking .pixi/envs/default/bin/mojo directly does
# not load the prelude -- even `print` comes back as "use of unknown
# declaration", which reads like a syntax error and is not one.
probe = "mojo run -I src src/gpu_probe.mojo"
test = "mojo run -I src tests/test_mathx.mojo"
# Build the Python extension.  The module name must match PyInit_<name> and the
# filename, or the import fails with a bare "dynamic module does not define".
build = "mojo build --emit shared-lib -I src src/fluid_gpu.mojo -o build/fluid_gpu.so"
# What every "build it with" message in the Python half has always named, and
# what did not exist: `full_pipeline.so` is the extension `envs.batchroll`
# imports, and nothing here built it.  Its kernel was five weeks older than its
# source before this task was written.  The manifest is what makes that
# visible -- see dytiscidae/envs/kernel.py.
build-all = """mojo build --emit shared-lib -I src src/full_pipeline.mojo -o build/full_pipeline.so && \
mojo build --emit shared-lib -I src src/fluid_gpu.mojo -o build/fluid_gpu.so && \
PYTHONPATH=.. python -c 'from dytiscidae.envs.kernel import write_manifest; print(write_manifest())'"""
