# What this project can do, and where each capability lives.
#
# The one file in docs/index/ that a person writes.  MODULES.md and SYMBOLS.md
# are generated from the AST by tools/index_gen.py and must not be edited; this
# one records the thing an import graph cannot recover -- that six functions
# spread across four packages together implement one capability.
# `evaluate_tier1_batch` and `evaluate_tier1` are two implementations of the
# same feature and do not import each other at all.
#
# Grammar (a strict subset of YAML; tools/index_gen.py:load_features parses it
# and raises with a line number on anything outside it):
#
#     FeatureName:
#       implementation:
#         - <dotted path, with or without the dytiscidae. prefix>
#       tests:
#         - tests.<module>            # or tests.<module>::<function>
#       note: one line, optional
#
# tests/test_index.py fails the build when an entry names something that no
# longer exists, when a feature has no test, or when a package of the project is
# named by no feature at all.  Read this file first when looking for where
# something is implemented; then SYMBOLS.md; then the source.

# --------------------------------------------------------------- the learner

SharedPolicy:
  implementation:
    - learning.ppo.SharedPolicy
    - learning.ppo.SharedPolicy.latent
    - learning.ppo.SharedPolicy.entropy
    - learning.ppo.SharedPolicy.log_prob_and_entropy
    - learning.ppo.SharedPolicy.act
    - learning.ppo.SharedPolicy.act_many
    - learning.ppo.SharedPolicy.observe
  tests:
    - tests.test_ppo::test_one_decision_has_the_right_shape
    - tests.test_ppo::test_batched_and_single_decisions_agree_when_deterministic
    - tests.test_ppo::test_the_observation_normaliser_is_associative
    - tests.test_search
  note: one Gaussian policy and value head for every morphology in the search

PPO:
  implementation:
    - learning.ppo.ppo_update
  tests:
    - tests.test_ppo::test_it_learns_a_reward_with_a_known_optimum
    - tests.test_ppo::test_the_reported_kl_cannot_be_negative
    - tests.test_ppo::test_the_entropy_bonus_has_a_gradient
    - tests.test_ppo::test_a_non_finite_batch_is_refused_rather_than_consumed
  note: one update per generation over everything the generation rolled out

RolloutBuffer:
  implementation:
    - learning.ppo.RolloutBuffer
    - learning.ppo.Trajectory
    - learning.ppo.SegmentCollector
  tests:
    - tests.test_ppo::test_gae_matches_an_independent_reference
    - tests.test_ppo::test_one_trajectory_never_bootstraps_off_another
    - tests.test_ppo::test_terminal_rewards_are_scaled_within_their_own_kind

AdvantageAndReturn:
  implementation:
    - learning.ppo.RolloutBuffer.build
  tests:
    - tests.test_ppo::test_gae_matches_an_independent_reference
    - tests.test_ppo::test_the_discount_behaves_at_both_ends
  note: GAE, with a zero terminal bootstrap because a segment ends when it ends

RewardShaping:
  implementation:
    - learning.ppo.potential_of
  tests:
    - tests.test_ppo::test_potential_shaping_telescopes_to_nothing
  note: potential-based, so it cannot change what is optimal

