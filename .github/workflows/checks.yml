# The checks a hosted runner can actually make.
#
# Two jobs, split by what they need rather than by what they test:
#
#   hexagon  -- a bare interpreter, no pip install at all.  That is not a
#               convenience, it is the test: `tests/test_architecture.py`
#               asserts that domain/, ports/ and application/ load in an
#               interpreter where torch, mujoco and numpy are not importable,
#               and the cheapest way to be sure of that is a runner where they
#               are not installed.
#   learner  -- numpy and a CPU torch, for the shared PPO learner.
#   physics  -- numpy, scipy and a headless MuJoCo.  No GPU, no Mojo build.
#
# The physics job exists because of a measurement, not a guess.  `tools/
# suite_probe.py` ran every test function of `tests/test_physics.py` in its own
# interpreter on a machine with no GPU fluid extension: **36 of the 37 pass and
# exactly one is blocked.**  The suite used to abort on that one and take four
# more down with it, which is why it looked like a suite that needed hardware.
# It does not; it needs `MUJOCO_GL=disable` and one function skipped, and it
# brings 203 checks that previously ran in no automated place at all.
#
# What is still absent: tests/test_search.py.  It takes roughly half an hour and
# skips three functions here, so it stays the canary that runs on the machine
# with the hardware rather than on every push.

name: checks

# `push` is restricted to the default branch on purpose.  With `branches: ["**"]`
# every push to a PR branch ran the whole workflow twice on the same commit --
# once for the push and once for the pull_request -- which is what the first run
# of this file did.  The PR event is what gates a merge; the main event is what
# catches a bad merge.
on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; there is no reason to finish the older run.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hexagon:
    name: hexagon + index (no third-party packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: the navigation index is what the source generates
        run: PYTHONPATH=. python tools/index_gen.py check

      - name: the suites that need nothing installed
        run: |
          set -e
          for s in index architecture domain application adapters worker; do
              echo "=== tests/test_$s.py ==="
              PYTHONPATH=. python "tests/test_$s.py"
          done

  learner:
    name: shared PPO learner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install numpy and a CPU torch
        run: python -m pip install --quiet numpy "torch>=2.2"

      - name: the learner, its buffer and its determinism
        # The integration checks at the end of this suite need the batched
        # evaluator and skip themselves, with the reason printed, when it is
        # not importable.  Everything before them is the algorithm alone.
        run: PYTHONPATH=. python tests/test_ppo.py

      - name: the search adapter
        run: PYTHONPATH=. python tests/test_search_adapter.py

  physics:
    name: physics and the numeric suites
    runs-on: ubuntu-latest
    env:
      # MuJoCo 3.13 imports a renderer at `import mujoco`, which needs a GL
      # backend a hosted runner does not have.  `disable` skips it; nothing
      # below renders.
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install the CPU-only scientific stack
        run: python -m pip install --quiet numpy scipy "mujoco>=3.1"

      - name: the fast numeric suites
        run: |
          set -e
          for s in math added_mass hull_buckling jet_energy reduced_frequency \
                   stall_blend mobility_cache gpu_mirror; do
              echo "=== tests/test_$s.py ==="
              PYTHONPATH=. python "tests/test_$s.py"
          done

      - name: the physics suite
        # One function needs the Mojo GPU extension and reports itself as
        # [skip]; the summary line carries the count, so a run that skipped
        # something cannot be read as a clean pass.
        run: PYTHONPATH=. python tests/test_physics.py
